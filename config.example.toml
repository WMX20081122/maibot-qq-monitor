[plugin]
enabled = true

[admin]
# 管理员 QQ 号列表（可查记录）
superusers = []
# 机器人昵称（用于邮件与记录标识）
nickname = []

[mail]
# 邮件通知配置（QQ 邮箱 SMTP）
mail_enable = true
smtp_host = "smtp.qq.com"
smtp_port = 465
# 发件邮箱（需在 QQ 邮箱开启 SMTP 并生成授权码）
mail_sender = ""
# SMTP 授权码（非登录密码）
mail_auth_code = ""
# 目标接收邮箱
mail_to = ""
mail_subject_prefix = "【QQ在线监控】"

[monitor]
# 正常状态下每 10 秒探测一次（本地 API，开销很低）
probe_interval = 10
# 疑似掉线/已掉线时改用短间隔复检，加快确认与恢复
probe_retry_interval = 10
# 单次接口调用超时：机器繁忙时接口会变慢，超时太短会把「慢」当成「掉线」
probe_timeout = 10
# 连续 N 次失败才进入掉线候选
probe_fail_threshold = 3
# 失败持续 N 秒才确认掉线并通知（短暂抖动不再成对发「掉线+上线」邮件）
offline_confirm_seconds = 60
# 连续 N 次成功才判定恢复上线，且需稳定 N 秒
recover_success_threshold = 3
recover_confirm_seconds = 20
# N 秒内收到过消息则不判掉线（防误报；明确断开信号不受此限制）
grace_seconds = 30
# 判定掉线前的二次校验：直连 NapCat HTTP 端口，可达说明只是调用卡顿
# 填 NapCat 的 HTTP 端口（常见 2000 / 3000）即启用，默认 0 表示关闭；
# 只做本地 TCP 连通判断，不要指向内网其他服务或云元数据地址
http_probe_host = "127.0.0.1"
http_probe_port = 0
# 每次重启 MaiBot 探测到在线时发送「上线」邮件，觉得吵可改 false
notify_on_load = true
# 活性探针：NapCat 的 get_status 读本地缓存，QQ 会话断开后仍显示「在线」（僵尸在线）。
# 探针定期用 no_cache 查询自身资料强制走一次腾讯服务器，连续失败即判定掉线并发邮件。
liveness_enabled = true
liveness_interval = 60
liveness_fail_threshold = 2
# 本地最多保留记录条数
record_max = 50

[command]
# 群聊/私聊发送以下指令查看登录/掉线记录（修改后需重载插件）
ps_command = ["在线状态", "上下线记录"]
# 仅管理员可用查看命令
ps_only_su = true
